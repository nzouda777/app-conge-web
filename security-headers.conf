# Shared security headers. Included inside every location block because
# nginx's add_header does NOT inherit into a location that sets its own
# add_header — so each location must pull these in explicitly.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# connect-src: 'self' covers the production single-origin setup (frontend
# and API share the domain, API under /api via the Caddy reverse proxy).
# http://localhost:3000 is only for the local docker-compose build, where
# the SPA calls the API cross-origin. No blanket https: — nothing legitimate
# connects off-origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:3000; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
