# En-têtes de sécurité partagés. Inclus dans CHAQUE bloc location : le
# `add_header` de nginx n'est pas hérité par une location qui pose le sien, il
# faut donc les rappeler explicitement à chaque fois.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
# Interdit à un navigateur de conserver la page dans l'historique arrière après
# déconnexion sur un poste partagé.
add_header Cache-Control "no-store" always;

# `connect-src 'self'` suffit en production : l'interface et l'API partagent
# le domaine, l'API vivant sous /api via le proxy Caddy.
#
# En développement, en revanche, l'interface est servie sur un port et l'API
# sur un autre : ce sont deux origines distinctes pour le navigateur, et
# `'self'` seul BLOQUE l'appel avant même qu'il parte — l'utilisateur voit
# « Le serveur est injoignable », sans que rien n'atteigne le réseau.
#
# Le marqueur __API_ORIGIN__ ci-dessous est remplacé au moment du build par
# l'origine de l'API quand celle-ci est absolue (développement), et retiré
# quand elle est relative (production). Voir le Dockerfile.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
