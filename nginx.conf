server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas annoncer la version de nginx dans l'en-tête Server ni les pages
    # d'erreur.
    server_tokens off;

    # Taille maximale d'un corps de requête. Les téléversements passent par
    # l'API via Caddy, pas par ici : une valeur basse suffit et ferme une voie
    # de saturation.
    client_max_body_size 1m;

    # index.html référence des bundles dont le nom porte une empreinte : il ne
    # doit JAMAIS être servi depuis un cache après un déploiement, sinon le
    # navigateur continue de pointer vers un bundle ancien (ou déjà évincé).
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Le service worker ne doit pas non plus être mis en cache : c'est lui qui
    # porte la logique de mise à jour. Un sw.js périmé fige l'application sur
    # une version ancienne.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        types { } default_type application/manifest+json;
    }

    # Ressources au nom versionné par empreinte : immuables, donc cachables
    # sans limite. C'est ce qui rend le démarrage instantané.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location /icons/ {
        include /etc/nginx/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
}
