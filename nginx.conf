server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in the Server header / error pages.
    server_tokens off;

    # index.html references content-hashed bundles under /assets/ — it must
    # never be served stale from a browser cache after a deploy, otherwise
    # the browser keeps pointing at an old (or already-evicted) bundle.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
